# Development stack.
#
# Source is bind-mounted so edits are live, and Postgres data lives in a named
# volume so `docker compose down` does not wipe the database you were working
# against. For a deployment use docker-compose.prod.yml instead.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: medverify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: medverify
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      # `depends_on` only waits for the container to start, not for Postgres to
      # accept connections. Without this the backend races the database on a
      # cold `up` and dies before the first migration.
      test: ["CMD-SHELL", "pg_isready -U medverify -d medverify"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      # Root context: the app imports the root-level `shared/` package.
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - uploads_dev:/app/uploads
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - JWT_BLOCKLIST_REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://medverify:${POSTGRES_PASSWORD:-change_me}@db:5432/medverify
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A celery_worker.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - uploads_dev:/app/uploads
    environment:
      - FLASK_ENV=development
      # The worker consumes the queue; it must not run migrations too, or two
      # containers race the same Alembic lock on every boot.
      - MIGRATE_ON_START=false
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - JWT_BLOCKLIST_REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://medverify:${POSTGRES_PASSWORD:-change_me}@db:5432/medverify
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data_dev:
  uploads_dev:
