# Production stack for a single VPS.
#
#     cp .env.production.example .env && edit it
#     docker compose -f docker-compose.prod.yml up -d --build
#
# Shape of it: nginx (inside the frontend image) is the only published port. It
# serves the built SPA and reverse-proxies /api to the backend, so the browser
# sees one origin and CORS never enters the picture. Postgres and Redis are not
# published at all — they are reachable only on the internal Docker network.
#
# For HTTPS, run with `--profile tls` after pointing DOMAIN at this host; Caddy
# then terminates TLS and obtains a certificate automatically. Without the
# profile the stack serves plain HTTP on ${HTTP_PORT:-80}, which is what you
# want when an external reverse proxy already terminates TLS.

x-backend-env: &backend-env
  FLASK_ENV: production
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
  DATABASE_URL: postgresql://medverify:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/medverify
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  JWT_BLOCKLIST_REDIS_URL: redis://redis:6379/0
  JWT_BLOCKLIST_REQUIRED: "true"
  # Same-origin through nginx, so no cross-origin request is ever made. Set
  # this only if you serve the API on a different host from the frontend.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Optional bootstrap accounts. Unset by default, in which case no user is
  # created and the first account must be registered through the app. These
  # have to be passed through explicitly or the documented seeding silently
  # does nothing in a deployed stack.
  MEDVERIFY_SEED_ADMIN_PASSWORD: ${MEDVERIFY_SEED_ADMIN_PASSWORD:-}
  MEDVERIFY_SEED_VERIFIER_PASSWORD: ${MEDVERIFY_SEED_VERIFIER_PASSWORD:-}
  MEDVERIFY_SEED_VIEWER_PASSWORD: ${MEDVERIFY_SEED_VIEWER_PASSWORD:-}

x-build: &backend-build
  # Root context: the app imports the root-level `shared/` package.
  context: .
  dockerfile: backend/Dockerfile

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medverify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: medverify
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medverify -d medverify"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Deliberately no `ports`. The database is reachable only from this
    # network; publishing 5432 on a VPS exposes it to the internet.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: *backend-build
    restart: unless-stopped
    environment:
      <<: *backend-env
      # One migrator. The web container owns the schema; the worker waits.
      MIGRATE_ON_START: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    volumes:
      # Uploaded certificates persist here. Without this volume every redeploy
      # silently loses the documents behind existing verification records.
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: *backend-build
    restart: unless-stopped
    command: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2}
    environment:
      <<: *backend-env
      MIGRATE_ON_START: "false"
    volumes:
      # The same volume as the backend: a Celery task is handed a file *path*,
      # so the worker must see the very files the web container wrote.
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Empty on purpose — the client falls back to window.location.origin
        # and nginx proxies /api to the backend on the same origin.
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

  # Optional TLS terminator: `docker compose -f docker-compose.prod.yml --profile tls up -d`
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Not `:?required` — Compose interpolates every service even when its
      # profile is inactive, so a required DOMAIN would block the plain-HTTP
      # stack too. Left empty, Caddy refuses to start with a clear "empty site
      # address" error, which only happens if you asked for the tls profile.
      DOMAIN: ${DOMAIN:-}
      EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  pg_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config:
