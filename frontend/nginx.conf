# Serves the built SPA and proxies the API to the backend container.
#
# Putting both behind one origin is what makes the deployed app work without
# CORS at all: the browser only ever talks to this server, so `VITE_API_URL`
# can stay empty and the client falls back to `window.location.origin`.

upstream backend {
    # Resolved on the Docker network. Matches the service name in
    # docker-compose.prod.yml.
    server backend:5000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 16 MB by Flask's MAX_CONTENT_LENGTH; nginx has to
    # agree or a large certificate is rejected here with an opaque 413 before
    # the app ever sees it.
    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR, image forensics and live RxNorm lookups on one document can run
        # well past nginx's 60s default. The pipeline endpoint is the slowest.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # index.html must never be cached, or a browser keeps loading the old
    # bundle's asset names after a deploy and the app breaks on refresh.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: every unknown path is a React route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
