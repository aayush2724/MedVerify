name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        # rapidocr-onnxruntime pulls in the full opencv-python, so libgl1 is
        # required even though requirements.txt asks for the headless build.
        # The OCR chain also needs the Tesseract binary.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng \
            libglib2.0-0 libsm6 libxext6 libgl1 libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run tests
        # The suite is fully offline — RxNorm and openFDA are stubbed — so this
        # stays deterministic and does not depend on either API being up.
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx eslint src --max-warnings=0
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        # Root context on purpose: the app imports the root-level `shared/`
        # package, which a backend-scoped context cannot see. Building it here
        # is what stops that regression from reaching a server.
        run: docker build -f backend/Dockerfile -t medverify-backend:ci .

      - name: Verify the backend image can import the app
        run: |
          docker run --rm -e DATABASE_URL=sqlite:///:memory: \
            --entrypoint python medverify-backend:ci \
            -c "from app import create_app; from app.config import TestingConfig; create_app(TestingConfig); print('app imports OK')"

      - name: Build frontend image
        run: docker build -t medverify-frontend:ci ./frontend
